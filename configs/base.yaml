# burst study -- base configuration
#
# Every value shared by all 40 runs lives here. A run override file
# (configs/runs/seedNN_arm.yaml) may set ONLY `seed` and `arm`; anything else
# is rejected by the loader. That restriction is the whole point: the study's
# central claim is that the 40 runs were identical except for seed and arm,
# and this file is the evidence.
#
# FORMATTING RULE, non-obvious and load-bearing:
# Write every rate in plain decimal form (0.0006), never in scientific
# notation (6e-4). PyYAML's float rule requires a decimal point, so `6e-4`
# parses as the *string* '6e-4', not a number. Likewise never write a bare
# no / yes / on / off as a value -- PyYAML turns those into booleans.
# burst/config.py type-checks every field after parsing so either mistake
# fails at load with the field name, but it is easier to just not make it.

# ---------------------------------------------------------------------------
# Per-run values. Left null on purpose: the run override file supplies them.
# The loader always requires both to be non-null, even when only inspecting.
# ---------------------------------------------------------------------------

# Seed index, 0..9 (n_seeds below). Zero-padded to two digits in the run name.
# The seed controls BOTH weight initialization AND data order. It is a single
# knob for the entire stochastic state of a run, not just for init -- two runs
# sharing a seed see the same initial weights and the same batch sequence, in
# the same order, which is what makes an arm-to-arm comparison a matched pair.
seed: null

# One of the four arms listed under experiment.arms below. Exact lowercase
# match; "Coherent" is rejected.
arm: null

# ---------------------------------------------------------------------------
# Model: GPT-2 Base
# ---------------------------------------------------------------------------
model:
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 50257
  block_size: 1024        # maximum context the model can attend over

  # Parameter count this architecture is expected to produce, recorded so a
  # later training run can check the model it built against the config that
  # described it. Nothing in this repo computes it -- there is no model code
  # here yet, by design.
  expected_param_count: 124439808

  # Whether the output projection reuses the token embedding matrix.
  #
  # DECIDED: true. This is forced by expected_param_count above -- 124439808 is
  # the GPT-2 Base count only with the embeddings tied. Untied, a separate
  # output projection adds another vocab_size * n_embd = 50257 * 768 =
  # 38597376 parameters, giving 163037184. GPT-2 ties by default, so `true`
  # keeps the architecture and the recorded parameter count consistent.
  tie_embeddings: true

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  batch_size: 256
  seq_len: 1024

  # Optimizer steps for the whole run.
  #
  # Steps are 0-INDEXED: the first step is 0 and the LAST STEP IS 9535
  # (total_steps - 1). The loader already assumed this -- injection_step is
  # range-checked as 0 <= step < total_steps -- but it was never written down,
  # so it is written down here. The training loop must honour it, and anything
  # that keys off "the last step" must compute total_steps - 1 rather than
  # hardcoding 9535.
  total_steps: 9536

# ---------------------------------------------------------------------------
# Optimizer
# ---------------------------------------------------------------------------
optimizer:
  name: adamw
  weight_decay: 0.1

  # Standard GPT-2 reproduction values. Identical across all arms, so they
  # cannot bias a between-arm comparison -- they are here so that "what
  # produced this checkpoint" has one answer, not because they are a variable.
  #
  # beta1/beta2 set the momentum timescales: 1/(1-beta1) = 10 steps for the
  # first moment, 1/(1-beta2) = 20 steps for the second. That matters for this
  # study specifically, because it bounds how long a single burst's gradient
  # keeps influencing updates after the injection step.
  beta1: 0.9
  beta2: 0.95

  # NOT 1e-8. PyYAML's float rule requires a decimal point, so `1e-8` parses
  # as the STRING '1e-8' -- see the formatting rule at the top of this file.
  # Written in plain decimal like every other rate here.
  eps: 0.00000001

  # UNDECIDED ON PURPOSE, and rejected at launch until it is decided.
  #
  # Clipping caps the largest updates. The burst is precisely an oversized
  # update -- that is what the study measures. Clipping would therefore cap
  # the arms unequally, in proportion to how large each arm's gradient is,
  # and undo the matching that 8b-i exists to establish.
  #
  # So this must be a stated choice, never an inherited default. Set it to a
  # positive number to clip, or decide explicitly not to clip. Either way it
  # gets written down here and recorded in resolved_config.yaml.
  grad_clip: null

# ---------------------------------------------------------------------------
# Learning rate schedule
# ---------------------------------------------------------------------------
learning_rate:
  schedule: cosine
  peak: 0.0006            # NOT 6e-4, see the formatting rule at the top
  warmup_steps: 200
  final: 0.00006          # NOT 6e-5

# ---------------------------------------------------------------------------
# Corpus
# ---------------------------------------------------------------------------
corpus:
  name: openwebtext
  slice_description: 2.5B token slice

  # The loader asserts batch_size * seq_len * total_steps == this number.
  # 256 * 1024 * 9536 = 2499805184. If someone edits one of the three and not
  # the others, load fails immediately rather than 40 runs later.
  expected_token_budget: 2499805184

# ---------------------------------------------------------------------------
# Determinism
# ---------------------------------------------------------------------------
determinism:
  deterministic: true

# ---------------------------------------------------------------------------
# Experiment shape
# ---------------------------------------------------------------------------
experiment:
  n_seeds: 10
  arms:
    - coherent            # a meaningful passage
    - noise               # random real words
    - ordinary            # normal text
    - twin                # no injection at all -- the matched control

# ---------------------------------------------------------------------------
# Injection
#
# Everything here is UNSET ON PURPOSE -- decided later. The coherent, noise and
# ordinary arms all require these to be non-null before launch. The twin arm
# does not: it receives no injection, so it launches fine with these still
# null, and simply ignores them once they are filled in.
# ---------------------------------------------------------------------------
injection:
  injection_step: null
  burst_length_tokens: null

  # Where the burst text for each injecting arm lives. One entry per injecting
  # arm; twin has no entry because it receives no text at all.
  #
  # These paths MUST be relative to the repository root, and the loader
  # enforces it. The burst text is experimental content, not configuration --
  # it is the independent variable of the study. It has to be committed
  # alongside the code so that the git commit hash recorded in
  # run_provenance.yaml covers the text as well. An absolute path would point
  # outside the repo, would differ between a laptop and a cluster, and would
  # leave the injected text unversioned, which makes the run unreproducible.
  #
  # Example, once decided:  coherent: configs/burst_texts/coherent.txt
  burst_text_paths:
    coherent: null
    noise: null
    ordinary: null

# ---------------------------------------------------------------------------
# Checkpointing
#
# DECIDED. Two schedules rather than one, because the two reasons to save a
# checkpoint have very different costs:
#
#   FULL checkpoints exist for CRASH RECOVERY. They carry weights, optimizer
#   state, the step number and the RNG state -- everything needed to resume a
#   dead run bit-identically. ~1.5 GB, because AdamW's two moment buffers are
#   each another full copy of the parameters.
#
#   WEIGHTS-ONLY checkpoints exist to MEASURE how the model changes during
#   training. They carry the weights and the step number, nothing else.
#   ~0.5 GB.
#
# Every metric in this study is a function of the weights alone, so
# weights-only checkpoints are sufficient for measurement. That is precisely
# what makes a 50-step interval affordable -- at full-checkpoint size the same
# sampling density would cost three times as much.
#
# Both values are intervals in optimizer steps, not directories. The output
# directory is deliberately NOT in this file -- it is a required --outdir
# command-line argument, so the same config runs unchanged on a laptop and on
# a cluster. The loader rejects any config that contains a path-like key.
#
# Two rules the loader encodes and the TRAINING LOOP MUST IMPLEMENT:
#
#   PRECEDENCE. When both intervals fire on the same step, write the FULL
#   checkpoint only. A weights-only file at that step would duplicate data
#   already inside the full one. This is why full_interval must be an exact
#   multiple of weights_only_interval -- the loader rejects any other pairing,
#   since otherwise the two schedules drift and "same step" stops being a
#   well-defined idea.
#
#   FINAL STEP. The last step (total_steps - 1 = 9535) always saves a FULL
#   checkpoint, whatever the intervals say. 9536 is divisible by neither 50
#   nor 1000, so without this rule the finished model -- the thing every
#   headline comparison in the study is computed on -- would never be written
#   at all. The rule keys off the computed last step, never a literal 9535.
#
# A checkpoint is due after every N *completed* steps, i.e. at 0-indexed step s
# when (s + 1) % N == 0. So the first weights-only checkpoint lands at step 49,
# not step 0.
#
# The loader derives the resulting counts and the storage estimate from these
# two numbers and total_steps; run `python -m burst.config ...` to print them.
# ---------------------------------------------------------------------------
checkpointing:
  weights_only_interval: 50
  full_interval: 1000
