# burst study -- base configuration
#
# Every value shared by all 70 runs lives here. A run override file
# (configs/runs/seedNN_arm.yaml) may set ONLY `seed` and `arm`; anything else
# is rejected by the loader. That restriction is the whole point: the study's
# central claim is that the 70 runs were identical except for seed and arm,
# and this file is the evidence.
#
# FORMATTING RULE, non-obvious and load-bearing:
# Write every rate in plain decimal form (0.0006), never in scientific
# notation (6e-4). PyYAML's float rule requires a decimal point, so `6e-4`
# parses as the *string* '6e-4', not a number. Likewise never write a bare
# no / yes / on / off as a value -- PyYAML turns those into booleans.
# burst/config.py type-checks every field after parsing so either mistake
# fails at load with the field name, but it is easier to just not make it.

# ---------------------------------------------------------------------------
# Per-run values. Left null on purpose: the run override file supplies them.
# The loader always requires both to be non-null, even when only inspecting.
# ---------------------------------------------------------------------------

# Seed index, 0..9 (n_seeds below). Zero-padded to two digits in the run name.
# The seed controls BOTH weight initialization AND data order. It is a single
# knob for the entire stochastic state of a run, not just for init -- two runs
# sharing a seed see the same initial weights and the same batch sequence, in
# the same order, which is what makes an arm-to-arm comparison a matched pair.
seed: null

# One of the seven arms listed under experiment.arms below. Exact lowercase
# match; "Fluent-False" is rejected.
arm: null

# ---------------------------------------------------------------------------
# Model: GPT-2 Base
# ---------------------------------------------------------------------------
model:
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 50257
  block_size: 1024        # maximum context the model can attend over

  # Parameter count this architecture is expected to produce, recorded so a
  # later training run can check the model it built against the config that
  # described it. Nothing in this repo computes it -- there is no model code
  # here yet, by design.
  expected_param_count: 124439808

  # Whether the output projection reuses the token embedding matrix.
  #
  # DECIDED: true. This is forced by expected_param_count above -- 124439808 is
  # the GPT-2 Base count only with the embeddings tied. Untied, a separate
  # output projection adds another vocab_size * n_embd = 50257 * 768 =
  # 38597376 parameters, giving 163037184. GPT-2 ties by default, so `true`
  # keeps the architecture and the recorded parameter count consistent.
  tie_embeddings: true

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  batch_size: 256
  seq_len: 1024

  # Sequences per forward pass. batch_size / micro_batch is the number of
  # gradient accumulation steps that make up one optimizer step.
  #
  # SET TO 8 on 2026-08-03 to match probes/determinism/train_once.py, so that
  # the committed determinism result stays comparable to the loop meant to
  # inherit it. It was null until then, and the loop REFUSED to run: there is
  # still no default and no inferred value, because this number is part of the
  # study's definition rather than a performance knob:
  #
  # ACCUMULATION SUMS PARTIAL GRADIENTS IN SEQUENCE, AND FLOATING-POINT
  # ADDITION IS NOT ASSOCIATIVE. 8 x 32 and 16 x 16 produce DIFFERENT BITS
  # from identical data. Two runs that agree on every other value here and
  # differ in this one are not the same run, and nothing downstream would
  # notice: resolved_config.yaml would be byte-identical between them.
  #
  # Accumulation is mandatory rather than optional. A full batch of logits is
  # 256 x 1024 x 50257 x 4 B = 52.70 GB against 48 GiB on the card the
  # determinism probe used, so micro_batch == batch_size cannot run at all.
  #
  # The determinism result in docs/measurements/2026-08-02-determinism-check.md
  # was established at micro_batch 8 -- a value probes/determinism/train_once.py
  # INVENTED because this field did not exist. That result therefore describes
  # a configuration nobody chose, and it does NOT transfer to any other value
  # here. See S67.
  #
  # SO 8 IS AN INHERITED VALUE, NOT A MEASURED ONE. It is set to keep the
  # determinism evidence comparable, not because anything measured it to be
  # right. THE PILOT IS WHAT TURNS IT INTO A CHOSEN VALUE, by measuring the
  # memory ceiling and the step time on real hardware. Until then, treat this
  # number as provisional and as the probe's invention.
  micro_batch: 8

  # The loader asserts batch_size % micro_batch == 0 when micro_batch is set.

  # Compute dtype for the forward and backward pass: fp32 or bf16.
  #
  # SET TO fp32 on 2026-08-03, matching probes/determinism/train_once.py. It
  # was null until then and the loop REFUSED without it, for the same
  # reason as micro_batch: it CHANGES WHICH CUDA KERNELS RUN, and therefore
  # reduction order. The determinism probe measured this directly -- fp32
  # selected fmha_cutlassF/B, bf16 selected pytorch_flash::flash_fwd/bwd, 66
  # kernels against 74.
  #
  # NOTE: scripts/train.py implements fp32 ONLY. It has no autocast, and it
  # refuses bf16 explicitly rather than training fp32 while this field claims
  # bf16. probes/determinism covers both; the loop does not. See S78.
  #
  # fp32 is therefore the only value the loop can honour, and it is also the
  # one the determinism result was taken under.
  dtype: fp32

  # Optimizer steps for the whole run.
  #
  # Steps are 0-INDEXED: the first step is 0 and the LAST STEP IS 9535
  # (total_steps - 1). The loader already assumed this -- injection_step is
  # range-checked as 0 <= step < total_steps -- but it was never written down,
  # so it is written down here. The training loop must honour it, and anything
  # that keys off "the last step" must compute total_steps - 1 rather than
  # hardcoding 9535.
  total_steps: 9536

# ---------------------------------------------------------------------------
# Optimizer
# ---------------------------------------------------------------------------
optimizer:
  name: adamw
  weight_decay: 0.1

  # Standard GPT-2 reproduction values. Identical across all arms, so they
  # cannot bias a between-arm comparison -- they are here so that "what
  # produced this checkpoint" has one answer, not because they are a variable.
  #
  # beta1/beta2 set the momentum timescales: 1/(1-beta1) = 10 steps for the
  # first moment, 1/(1-beta2) = 20 steps for the second. That matters for this
  # study specifically, because it bounds how long a single burst's gradient
  # keeps influencing updates after the injection step.
  beta1: 0.9
  beta2: 0.95

  # Which AdamW implementation: foreach, fused, or single.
  #
  # SET TO foreach on 2026-08-03, matching probes/determinism/train_once.py.
  # It was null and launch-blocking until then. The three group their
  # arithmetic differently -- per tensor, per fused group, or in one kernel --
  # so each produces DIFFERENT BITS from identical moments.
  #
  # THIS FIELD EXISTS BECAUSE ITS ABSENCE ALREADY CAUSED A DIVERGENCE.
  # scripts/train.py hardcoded `foreach=False, fused=False` -- the `single`
  # implementation -- while the committed determinism result in
  # docs/measurements/2026-08-02-determinism-check.md was produced under
  # `foreach`. The loop meant to inherit that evidence could not have
  # reproduced it, and nothing said so because nothing declared the value.
  # See S78.
  #
  # foreach is chosen for exactly that reason: it is what the determinism
  # result was produced under, so the loop can now inherit that evidence
  # rather than contradict it.
  adamw_impl: foreach

  # NOT 1e-8. PyYAML's float rule requires a decimal point, so `1e-8` parses
  # as the STRING '1e-8' -- see the formatting rule at the top of this file.
  # Written in plain decimal like every other rate here.
  eps: 0.00000001

  # DECIDED: 1.0, the standard GPT-2 reproduction value.
  #
  # Recorded honestly, because the two things you might want from this number
  # are not both available. 1.0 is what GPT-2, GPT-3 and nanoGPT use. It is
  # NOT high enough to guarantee the burst never reaches it: a batch gradient
  # at step 200 on a from-scratch model will plausibly exceed 1.0, and
  # clipping firing there is ordinary GPT-2 behaviour rather than a fault.
  #
  # So at this threshold clipping is a CONVENTION, not an active safety net
  # for the burst, and it was NOT tuned to protect the burst. It was chosen
  # for fidelity to standard practice, accepting that it may engage.
  #
  # Why that matters here: clipping caps the largest updates, and the burst is
  # precisely an oversized update. If it fires it caps the arms unequally, in
  # proportion to how large each arm's gradient is, and erodes the matching
  # 8b-i and 8b-iii exist to establish.
  #
  # THE TRAINING LOOP MUST RECORD WHETHER CLIPPING ENGAGED AT THE INJECTION
  # STEP. That check cannot run here -- there is no training loop and no
  # step-200 model -- so it is carried as a cross-module obligation in
  # implementation-notes.md. Without it, nobody can tell afterwards whether a
  # null result means the arms were matched or means clipping flattened them.
  #
  # Note this changes no number measured so far: every gradient norm in
  # docs/measurements/ is taken pre-clipping.
  grad_clip: 1.0

# ---------------------------------------------------------------------------
# Learning rate schedule
# ---------------------------------------------------------------------------
learning_rate:
  schedule: cosine
  peak: 0.0006            # NOT 6e-4, see the formatting rule at the top
  warmup_steps: 200
  final: 0.00006          # NOT 6e-5

# ---------------------------------------------------------------------------
# Corpus
# ---------------------------------------------------------------------------
corpus:
  name: openwebtext
  slice_description: 2.5B token slice

  # The loader asserts batch_size * seq_len * total_steps == this number.
  # 256 * 1024 * 9536 = 2499805184. If someone edits one of the three and not
  # the others, load fails immediately rather than every run later.
  expected_token_budget: 2499805184

# ---------------------------------------------------------------------------
# Determinism
# ---------------------------------------------------------------------------
determinism:
  deterministic: true

# ---------------------------------------------------------------------------
# Experiment shape
# ---------------------------------------------------------------------------
experiment:
  n_seeds: 10
  # Spec v4. Reconciled 2026-08-03; this list held the retired v3 four until
  # then, while bursts/ held v4 texts and README warned they disagreed.
  #
  # scrambled-corpus is CUT. Its text stays in bursts/ so the measurements
  # taken from it remain reproducible, but it is not a run condition -- topic
  # control across the scrambled family was traded for run count. The three
  # remaining scrambled/fluent arms are all Beatles-derived, which is a stated
  # limitation of the design rather than an oversight. See S79.
  arms:
    - fluent-false        # grammatical English asserting something FALSE
    - fluent-true         # same register and structure, asserting something TRUE
    - scrambled-false     # fluent-false with word order broken
    - scrambled-true      # fluent-true with word order broken
    - pos-substituted     # grammar preserved, lexical content destroyed
    - random-chars        # no word structure at all
    - twin                # no injection at all -- the matched control

# ---------------------------------------------------------------------------
# Injection
#
# DECIDED 2026-08-03. This header previously said "everything here is UNSET ON
# PURPOSE" and named the coherent, noise and ordinary arms -- all three of which
# were retired the same day, and all four values below were set hours later in
# step 14. Corrected rather than left.
#
# The six INJECTING arms require injection_step, burst_length_tokens,
# burst_position and their own burst_text_paths entry before launch. The twin
# arm does not: it receives no injection, so it sees these values and ignores
# them.
#
# AS OF 2026-08-03 THERE ARE NO LAUNCH-BLOCKING NULLS LEFT IN THIS FILE.
# training.micro_batch, training.dtype and optimizer.adamw_impl were the last
# three and are now set, to the values probes/determinism/train_once.py uses.
# The pilot is what turns micro_batch from an inherited value into a measured
# one; see the note at that field.
# ---------------------------------------------------------------------------
injection:
  # DECIDED: 200, from docs/spec-v4.md. Steps are 0-INDEXED, and this is
  # compared by direct equality against the loop's step counter -- no
  # adjustment. learning_rate.warmup_steps is also 200, so step 200 is the
  # first step on the cosine tail rather than inside warmup.
  #
  # The anchor that makes an off-by-one visible: a weights-only checkpoint
  # lands at step 199, because (199 + 1) % 50 == 0, and checkpoints are written
  # AFTER the optimizer step. So the step-199 file holds the state after steps
  # 0..199 and BEFORE this injection -- which is what makes "identical through
  # 199, different from 200" a checkable claim rather than a described one.
  injection_step: 200
  # DECIDED: 194. Every arm text in bursts/ is exactly this long under the
  # GPT-2 tokenizer, asserted by make_bursts.py on write and recorded per arm
  # in bursts/provenance.json. The hook re-checks it on load and refuses on a
  # mismatch rather than splicing a burst of the wrong length into a sequence
  # that would still be 1024 tokens for a different reason.
  burst_length_tokens: 194

  # Where in the 1024-token sequence the burst starts. DECIDED: 400.
  #
  # This value lived as `POSITION = 400` in three separate scripts and in the
  # step 8 measurement files, and the injection hook would have been a fourth
  # copy -- which is exactly how S67's three undeclared values happened. It is
  # a study-defining quantity: docs/measurements/8b-ii-position-sweep.md swept
  # 1, 100, 200, 400, 600 and 830, and every arm-matching number in step 8 was
  # measured at 400. Injecting at any other position would mean the arms were
  # matched at a position the study does not use.
  #
  # A test asserts this equals the `burst_position` recorded in
  # docs/measurements/8b-i-in-context-match.json, so drift breaks the suite
  # rather than the study.
  #
  # Range: 1 <= burst_position <= seq_len - burst_length_tokens (830). Position
  # 0 is invalid -- the token at index 0 has nothing before it to be predicted
  # from, so the burst region would have 193 predictions instead of 194.
  burst_position: 400

  # Where the burst text for each injecting arm lives. One entry per injecting
  # arm; twin has no entry because it receives no text at all.
  #
  # These paths MUST be relative to the repository root, and the loader
  # enforces it. The burst text is experimental content, not configuration --
  # it is the independent variable of the study. It has to be committed
  # alongside the code so that the git commit hash recorded in
  # run_provenance.yaml covers the text as well. An absolute path would point
  # outside the repo, would differ between a laptop and a cluster, and would
  # leave the injected text unversioned, which makes the run unreproducible.
  #
  # DECIDED 2026-08-03: the texts stay at bursts/, where make_bursts.py writes
  # them and where bursts/provenance.json already records a sha256 for each.
  # This comment previously suggested configs/burst_texts/, which was never
  # built -- moving them would mean regenerating provenance and re-verifying
  # every step 8 measurement for no benefit.
  #
  # NOTE: bursts/ holds SEVEN arm texts and provenance records seven. Only the
  # six listed below are run conditions. scrambled-corpus was cut as an arm on
  # 2026-08-03; its text and measurements stay reproducible and it is not
  # reachable from a run -- the loader refuses `arm: scrambled-corpus`.
  burst_text_paths:
    fluent-false: bursts/fluent_false.txt
    fluent-true: bursts/fluent_true.txt
    scrambled-false: bursts/scrambled_false.txt
    scrambled-true: bursts/scrambled_true.txt
    pos-substituted: bursts/pos_substituted.txt
    random-chars: bursts/random_chars.txt

# ---------------------------------------------------------------------------
# Checkpointing
#
# DECIDED. Two schedules rather than one, because the two reasons to save a
# checkpoint have very different costs:
#
#   FULL checkpoints exist for CRASH RECOVERY. They carry weights, optimizer
#   state, the step number and the RNG state -- everything needed to resume a
#   dead run bit-identically. ~1.5 GB, because AdamW's two moment buffers are
#   each another full copy of the parameters.
#
#   WEIGHTS-ONLY checkpoints exist to MEASURE how the model changes during
#   training. They carry the weights and the step number, nothing else.
#   ~0.5 GB.
#
# Every metric in this study is a function of the weights alone, so
# weights-only checkpoints are sufficient for measurement. That is precisely
# what makes a 50-step interval affordable -- at full-checkpoint size the same
# sampling density would cost three times as much.
#
# Both values are intervals in optimizer steps, not directories. The output
# directory is deliberately NOT in this file -- it is a required --outdir
# command-line argument, so the same config runs unchanged on a laptop and on
# a cluster. The loader rejects any config that contains a path-like key.
#
# Two rules the loader encodes and the TRAINING LOOP MUST IMPLEMENT:
#
#   PRECEDENCE. When both intervals fire on the same step, write the FULL
#   checkpoint only. A weights-only file at that step would duplicate data
#   already inside the full one. This is why full_interval must be an exact
#   multiple of weights_only_interval -- the loader rejects any other pairing,
#   since otherwise the two schedules drift and "same step" stops being a
#   well-defined idea.
#
#   FINAL STEP. The last step (total_steps - 1 = 9535) always saves a FULL
#   checkpoint, whatever the intervals say. 9536 is divisible by neither 50
#   nor 1000, so without this rule the finished model -- the thing every
#   headline comparison in the study is computed on -- would never be written
#   at all. The rule keys off the computed last step, never a literal 9535.
#
# A checkpoint is due after every N *completed* steps, i.e. at 0-indexed step s
# when (s + 1) % N == 0. So the first weights-only checkpoint lands at step 49,
# not step 0.
#
# The loader derives the resulting counts and the storage estimate from these
# two numbers and total_steps; run `python -m burst.config ...` to print them.
# ---------------------------------------------------------------------------
checkpointing:
  weights_only_interval: 50
  full_interval: 1000
