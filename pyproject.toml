[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burst"
version = "0.1.0"
description = "Configuration scaffold for the burst injection study"
requires-python = ">=3.11"

# Exact pins, not ranges. A range would let a future PyYAML change how a
# number parses without anything in this repo recording that it happened,
# which is the same class of silent drift this whole config system exists to
# prevent. Bump these deliberately and note it in implementation-notes.md.
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

# scripts/burst_match.py only. Kept OUT of the base install on purpose: the
# config system must keep loading on a laptop with no ML stack, and torch is
# a multi-gigabyte dependency that nothing else in this repo needs. Installing
# the base package and running the config tests must never pull these in.
#
#   pip install -e ".[dev]"              # config work -- no torch
#   pip install -e ".[dev,measure]"      # burst_match work
#
# On a CPU-only machine, install torch from PyTorch's CPU index first to avoid
# downloading the CUDA build (about 2.5 GB against about 250 MB):
#   pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
# The pin below is satisfied by the CPU wheel: PEP 440 treats `==2.13.0` as
# matching the local version `2.13.0+cpu`.
measure = [
    "torch==2.13.0",
    "transformers==5.14.1",
    # scripts/make_bursts.py streams the OpenWebText slice it cuts the
    # ordinary and noise spans from. Only the first run needs it online; the
    # slice is cached under a gitignored path afterwards.
    "datasets==5.0.1",
    # scripts/canonicalize.py, for scipy.optimize.linear_sum_assignment: the
    # permutation that best aligns one model to another. Canonicalization by
    # sorting needs no solver, but aligning an arm to its seed-matched twin is
    # a matching problem, and matching on the full weight vector is robust to
    # the near-ties that make a scalar sort key fragile.
    "scipy==1.18.0",
    # NOT a new dependency, but named explicitly because it is imported
    # directly rather than only through torch: scripts/gradient_direction.py
    # memmaps spilled gradients with it and scripts/canonicalize.py uses it for
    # the distance measurements. It arrived transitively before this line
    # existed, which meant the `measure` group did not actually declare
    # everything `measure` code imports.
    "numpy==2.5.1",
]

# scripts/build_pos_pool.py ONLY, and only when the POS pool is rebuilt.
# Deliberately its own group rather than part of `measure`: the tagger is a
# BUILD-TIME dependency. It runs once, its output (bursts/pos_pool.json) is
# committed with a SHA-256, and scripts/make_bursts.py reads that file and
# never imports nltk. Generating bursts therefore does not need this group.
#
# The tagger's model data (averaged_perceptron_tagger_eng) is a one-time
# runtime download to .corpus-cache/nltk_data/, which is gitignored. It cannot
# be pinned the way a pip package can, and does not need to be: reproducibility
# rests on the committed pool and its hash, not on rebuilding the pool. A
# from-scratch rebuild on another machine is not guaranteed byte-identical.
pos = [
    "nltk==3.9.2",
]

[tool.setuptools]
packages = ["burst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import burst` works from a plain checkout,
# without having to `pip install -e .` first. One less setup step to get wrong.
pythonpath = ["."]
