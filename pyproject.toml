[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burst"
version = "0.1.0"
description = "Configuration scaffold for the burst injection study"
requires-python = ">=3.11"

# Exact pins, not ranges. A range would let a future PyYAML change how a
# number parses without anything in this repo recording that it happened,
# which is the same class of silent drift this whole config system exists to
# prevent. Bump these deliberately and note it in implementation-notes.md.
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

# scripts/burst_match.py only. Kept OUT of the base install on purpose: the
# config system must keep loading on a laptop with no ML stack, and torch is
# a multi-gigabyte dependency that nothing else in this repo needs. Installing
# the base package and running the config tests must never pull these in.
#
#   pip install -e ".[dev]"              # config work -- no torch
#   pip install -e ".[dev,measure]"      # burst_match work
#
# On a CPU-only machine, install torch from PyTorch's CPU index first to avoid
# downloading the CUDA build (about 2.5 GB against about 250 MB):
#   pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
# The pin below is satisfied by the CPU wheel: PEP 440 treats `==2.13.0` as
# matching the local version `2.13.0+cpu`.
measure = [
    "torch==2.13.0",
    "transformers==5.14.1",
    # scripts/make_bursts.py streams the OpenWebText slice it cuts the
    # ordinary and noise spans from. Only the first run needs it online; the
    # slice is cached under a gitignored path afterwards.
    "datasets==5.0.1",
]

[tool.setuptools]
packages = ["burst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import burst` works from a plain checkout,
# without having to `pip install -e .` first. One less setup step to get wrong.
pythonpath = ["."]
